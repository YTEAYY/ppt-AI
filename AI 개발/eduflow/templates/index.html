<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EduFlow - 학교 맞춤형 AI 발표자료</title>
    <style>
        body { font-family: '맑은 고딕', Arial, sans-serif; background: #f7f9fa; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 32px; }
        h1 { color: #2d5be3; text-align: center; margin-bottom: 8px; }
        h2 { color: #444; margin-top: 32px; }
        label { font-weight: bold; display: block; margin: 16px 0 6px; }
        input[type="file"], input[type="text"], textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 12px; }
        button { background: #2d5be3; color: #fff; border: none; border-radius: 6px; padding: 12px 24px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1746a2; }
        .result { background: #eaf3ff; border-left: 4px solid #2d5be3; padding: 12px; margin-top: 18px; border-radius: 6px; }
        .footer { text-align: center; color: #aaa; margin-top: 40px; font-size: 0.95em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EduFlow</h1>
        <div style="text-align:center; color:#666; margin-bottom:24px;">학교 맞춤형 AI 발표자료 자동 생성 플랫폼</div>
        <form id="uploadForm">
            <h2>1. 발표자료 자동 생성</h2>
            <label for="file">발표 텍스트 파일</label>
            <input type="file" id="file" name="file" required>
            <label for="script">발표 스크립트 (선택)</label>
            <textarea id="script" name="script" rows="3" placeholder="발표 대본을 입력하세요..."></textarea>
            <button type="submit">PPT/PDF 자동 생성</button>
        </form>
        <div id="result" class="result" style="display:none;"></div>
        <form id="feedbackForm" style="margin-top:32px;">
            <h2>2. 피드백 제출</h2>
            <label for="feedback">피드백 내용</label>
            <textarea id="feedback" name="feedback" rows="2" required></textarea>
            <button type="submit">피드백 제출</button>
        </form>
        <div id="feedbackResult" class="result" style="display:none;"></div>
    </div>
    <div class="footer">EduFlow &copy; 2026</div>
    <script>
    // 발표자료 업로드 및 생성
    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('file');
        const script = document.getElementById('script').value;
        if (!fileInput.files.length) return;
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('script', script);
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        let html = '';
        if (data.status === 'success') {
            html += `<b>목차:</b><br>${data.outline.replace(/\n/g,'<br>')}<br><br>`;
            html += `<b>PPT 다운로드:</b> <a href="/download/${data.ppt_path.split('\\').pop().replace('.pptx','')}" target="_blank">PPT 파일</a><br>`;
            html += `<b>PDF 다운로드:</b> <a href="/download_pdf/${data.ppt_path.split('\\').pop().replace('.pptx','')}" target="_blank">PDF 파일</a>`;
        } else {
            html = '<span style="color:red;">PPT 생성 실패: ' + (data.error || '알 수 없는 오류') + '</span>';
        }
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = html;
        resultDiv.style.display = 'block';
    };
    // 피드백 제출
    document.getElementById('feedbackForm').onsubmit = async function(e) {
        e.preventDefault();
        const feedback = document.getElementById('feedback').value;
        const res = await fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ responses: [feedback] })
        });
        const data = await res.json();
        let html = '';
        if (data.status === 'success') {
            html = `<b>요약 결과:</b><br>${data.summary}`;
        } else {
            html = '<span style="color:red;">피드백 처리 실패</span>';
        }
        const resultDiv = document.getElementById('feedbackResult');
        resultDiv.innerHTML = html;
        resultDiv.style.display = 'block';
    };
    </script>
</body>
</html>
